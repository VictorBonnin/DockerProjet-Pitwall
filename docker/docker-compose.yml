services:
  postgres:
    image: postgres:16
    container_name: pitwall-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pitwall
    ports:
      - "5432:5432"
    volumes:
      - pitwall_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pitwall-redis
    ports:
      - "6379:6379"

volumes:
  pitwall_postgres_data:
